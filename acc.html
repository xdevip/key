<script>

const WAIT_TIME = 60;

const getBtn = document.getElementById("getAccBtn");
const timerEl = document.getElementById("timer");
const accBox = document.getElementById("accBox");

let cooldown = false;

async function getRandomAccount(){

    if(cooldown) return;

    cooldown = true;

    try{

        // đọc file json
        const response = await fetch("./accs.json");

        if(!response.ok){
            alert("Không tìm thấy file accs.json");
            cooldown = false;
            return;
        }

        const accounts = await response.json();

        // kiểm tra file rỗng
        if(accounts.length === 0){

            alert("Không có acc");

            cooldown = false;

            return;
        }

        // random acc
        const randomAcc =
        accounts[Math.floor(Math.random() * accounts.length)];

        document.getElementById("username").innerHTML =
            "👤 Tài khoản: " + randomAcc.username;

        document.getElementById("password").innerHTML =
            "🔑 Mật khẩu: " + randomAcc.password;

        accBox.style.display = "block";

        // countdown
        let time = WAIT_TIME;

        timerEl.innerText = time;

        const countdown = setInterval(() => {

            time--;

            timerEl.innerText = time;

            if(time <= 0){

                clearInterval(countdown);

                timerEl.innerText = "0";

                cooldown = false;

            }

        },1000);

    }

    catch(error){

        alert("Lỗi: " + error);

        cooldown = false;

    }

}

getBtn.addEventListener("click", getRandomAccount);

</script>
